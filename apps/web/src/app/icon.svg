<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand badge -->
  <rect width="64" height="64" rx="13" fill="#b3201c"/>
  <rect x="1" y="1" width="62" height="62" rx="12" fill="none" stroke="#f3ecdc" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- The Tilted Balance: a beam under pressure, still upright -->
  <!-- Central column -->
  <rect x="30.6" y="14" width="2.8" height="34" rx="1.4" fill="#f3ecdc"/>
  <!-- Pedestal -->
  <path d="M26 50 h12 l-2.4 -4 h-7.2 z" fill="#f3ecdc" fill-opacity="0.9"/>

  <!-- Tilted beam (left higher, right bearing weight) -->
  <line x1="14" y1="20" x2="50" y2="34" stroke="#f3ecdc" stroke-width="3" stroke-linecap="round"/>

  <!-- Left pan (higher) -->
  <line x1="14" y1="20" x2="14" y2="28" stroke="#f3ecdc" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 30 q 8 10 16 0" stroke="#f3ecdc" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Right pan (lower, under the tilt) -->
  <line x1="50" y1="34" x2="50" y2="42" stroke="#f3ecdc" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 44 q 8 10 16 0" stroke="#f3ecdc" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Fulcrum eyelets -->
  <circle cx="14" cy="20" r="2" fill="#f3ecdc"/>
  <circle cx="50" cy="34" r="2" fill="#f3ecdc"/>
</svg>
